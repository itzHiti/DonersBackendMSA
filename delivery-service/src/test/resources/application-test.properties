# Delivery Service Test Configuration

# Application
spring.application.name=delivery-service-test

# Database Configuration - H2 In-Memory
spring.datasource.url=jdbc:h2:mem:deliverydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Configuration - Disabled for tests
spring.flyway.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=delivery-service-group-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Security Configuration - OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/doner-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/doner-realm/protocol/openid-connect/certs

# Server Configuration
server.port=0

# Logging Configuration
logging.level.kz.itzhiti.deliveryservice=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Session Configuration
spring.session.jdbc.initialize-schema=always

